name: Generate Snake

on:
  schedule:
    # Запуск 3 раза в день: в 06:00, 12:00 и 18:00 по UTC (09:00, 15:00, 21:00 по МСК)
    - cron: "0 6,12,18 * * *"
  # Возможность ручного запуска из вкладки Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Определение месяца и выбор цвета для сезона
      - name: Set Seasonal Theme
        id: season
        run: |
          MONTH=$(date +%-m)
          case $MONTH in
            12|1|2)
              # Зима
              echo "SNAKE=#38bdf8" >> $GITHUB_OUTPUT
              echo "DOTS=#f0f9ff,#bae6fd,#38bdf8,#0284c7,#0369a1" >> $GITHUB_OUTPUT
              echo "BG=#0f172a" >> $GITHUB_OUTPUT
              ;;
            3|4|5)
              # Весна
              echo "SNAKE=#f43f5e" >> $GITHUB_OUTPUT
              echo "DOTS=#fdf2f8,#fbcfe8,#f472b6,#e11d48,#881337" >> $GITHUB_OUTPUT
              echo "BG=#18181b" >> $GITHUB_OUTPUT
              ;;
            6|7|8)
              # Лето
              echo "SNAKE=#84cc16" >> $GITHUB_OUTPUT
              echo "DOTS=#ecfdf5,#a7f3d0,#34d399,#10b981,#047857" >> $GITHUB_OUTPUT
              echo "BG=#064e3b" >> $GITHUB_OUTPUT
              ;;
            9|10|11)
              # Осень
              echo "SNAKE=#d97706" >> $GITHUB_OUTPUT
              echo "DOTS=#fef3c7,#fde68a,#f59e0b,#d97706,#78350f" >> $GITHUB_OUTPUT
              echo "BG=#18181b" >> $GITHUB_OUTPUT
              ;;
          esac

      # Генерация анимированной змейки
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=${{ steps.season.outputs.SNAKE }}&color_dots=${{ steps.season.outputs.DOTS }}&color_background=${{ steps.season.outputs.BG }}

      # Публикация результатов в ветку output
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

